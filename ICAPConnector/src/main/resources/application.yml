---
spring:
  application:
    name: tpicap-interface
    lifecycle:
      timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:h2:file:./data/mngdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      spring:
      path: /h2-console
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: 11003

app:
  connection:
    ssl: false
    host: 204.179.96.165
    port: 6264
    proxyHost:
    proxyPort: -1
    key: devscrpstpic
    value: test
  session:
    begin: "0 0 6 * * *"  # 6:00 AM daily in prod EDT time
    end: "0 0 20 * * *"  # 20:00 PM daily in prod EDT time
    refresh: 240000
    status: 240000
  pool:
    connector: 1           # Connector pool size
    processor: 4           # processor pool size
    recorder: 5            # recorder pool size
  tracing:
    path:
      success: tracing/messages/success       # success message folder
      failure: tracing/messages/failure       # failure message folder
      pending: tracing/messages/pending       # pending message folder
      raw: tracing/raw                        # Raw message folder
    archiving:
      age: 30
      interval: 86400000
      path: archive
    message:
      serialize-level: BUSINESS       # ALL: business message and session message
      # BUSINESS: business message only
      content-level: INBOUND        # NONE: Nothing to trace (not recommended)
        # BUSINESS: businesss only
      # INBOUND: inbound message only
      # OUTBOUND: includes outbound
      detailed: true        # to log message content
      housekeeping: 0       # 0: no housekeeping
      # n: days to clean
  pooling:
    active: true
    path: tracing/pooling              # pooling forlder for testing
  ackOnBooking: false
  timezone: "America/New_York"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, shutdown
    health:
      show-details: always
  endpoint:
    prometheus:
      enabled: true
    shutdown:
      enabled: true