    id 'org.springframework.boot' version '3.2.5'
//    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'net.zousys.mathtrading'
version = '1.0-SNAPSHOT'

dependencies {
    implementation('org.springframework.cloud:spring-cloud-dataflow-server:2.11.0') {
    }
    implementation 'org.springframework.cloud:spring-cloud-deployer-local:2.9.0'
    implementation 'org.springframework.boot:spring-boot-starter:2.7.18'
//
    runtimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform()
}